# JASIM CI Pipeline
# /خطاب التكامل المستمر
#
# Runs on every push and pull request:
# 1. Lint + Type check
# 2. Run all tests (unit + integration + e2e) with coverage
# 3. Build application
# 4. Deploy on main branch

name: JASIM CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run check

      - name: Run Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md,yml}"

  # ============================================
  # TEST (Unit + Integration + E2E)
  # ============================================
  test:
    name: Test Suite (Coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --reporter=verbose
        env:
          NODE_ENV: test
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: jasim-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ============================================
  # TEST ALL ROUTERS (25 Routers)
  # ============================================
  test-routers:
    name: Test All 25 tRPC Routers
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Intent Parser (50+ cases)
        run: npx vitest run tests/unit/intent-parser.test.ts

      - name: Test Memory Engine
        run: npx vitest run tests/unit/memory-engine.test.ts

      - name: Test Agent Router (20 agents)
        run: npx vitest run tests/unit/agent-router.test.ts

      - name: Test Haggle Engine
        run: npx vitest run tests/unit/haggle.test.ts

      - name: Test Zakat Calculator (2.5%)
        run: npx vitest run tests/unit/zakat.test.ts

      - name: Test Cross-Border Customs
        run: npx vitest run tests/unit/cross-border.test.ts

      - name: Test Sonic DNA Audio
        run: npx vitest run tests/unit/sonic-dna.test.ts

      - name: Test DNA Breeder
        run: npx vitest run tests/unit/dna-breeder.test.ts

      - name: Test Integration Flows
        run: npx vitest run tests/integration/

      - name: Test E2E Journeys
        run: npx vitest run tests/e2e/

  # ============================================
  # BUILD
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend (TypeScript)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  # ============================================
  # MOBILE BUILD CHECK
  # ============================================
  mobile-check:
    name: Mobile App Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Type check mobile app
        working-directory: ./mobile
        run: npx tsc --noEmit

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run CodeQL scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================
  # DEPLOY (only on main branch)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test-routers, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://jasim.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Replit
        run: |
          echo "Deploying JASIM V4 to production..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          # Production deploy script would go here
          # ./scripts/deploy.sh production

      - name: Notify deployment
        run: |
          echo "✅ JASIM V4 deployed successfully!"
          echo "🚀 https://jasim.app"
          echo "📱 Mobile: Available on App Store & Google Play"
