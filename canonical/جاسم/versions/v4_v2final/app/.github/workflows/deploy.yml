# JASIM CD Pipeline - Continuous Deployment
# /خطاب النشر المستمر
#
# Automated deployment to staging and production environments

name: JASIM CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.jasim.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to Staging..."
          echo "Environment: staging"
          echo "API URL: https://staging.jasim.app"
          ./scripts/deploy.sh staging

      - name: Run smoke tests on staging
        run: |
          echo "🔍 Running smoke tests..."
          curl -sf https://staging.jasim.app/health || exit 1

      - name: Notify staging deployment
        run: |
          echo "✅ Staging deployment complete!"
          echo "🔗 https://staging.jasim.app"

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://jasim.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (production)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to Production..."
          echo "Environment: production"
          echo "API URL: https://jasim.app"
          ./scripts/deploy.sh production

      - name: Run health check
        run: |
          echo "🔍 Running health check..."
          sleep 10
          curl -sf https://jasim.app/health || exit 1

      - name: Notify production deployment
        run: |
          echo "✅ Production deployment complete!"
          echo "🔗 https://jasim.app"
          echo "📱 Mobile apps updated"

  # ============================================
  # MOBILE APP DEPLOYMENT (EAS)
  # ============================================
  deploy-mobile:
    name: Deploy Mobile Apps (EAS)
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android (AAB)
        working-directory: ./mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (IPA)
        working-directory: ./mobile
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        working-directory: ./mobile
        run: eas submit --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store
        working-directory: ./mobile
        run: eas submit --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Notify mobile deployment
        run: |
          echo "📱 Mobile apps deployed!"
          echo "🤖 Google Play: com.jasim.app"
          echo "🍎 App Store: com.jasim.app"
