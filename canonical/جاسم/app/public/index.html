<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="JASIM - Unified Marketplace Platform. Amazon + LinkedIn + Uber + Airbnb + Shopify + Fiverr in one living organism." />
  <meta name="keywords" content="marketplace, jobs, transport, rental, freelance, healthcare, travel, education, Kuwait, JASIM" />
  <meta name="author" content="JASIM Team" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JASIM" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />
  <link rel="icon" type="image/png" href="/icon-72x72.png" />
  <title>JASIM v33.1 — Unified Marketplace Platform</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen" id="loading">
      <div class="loading-spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        setTimeout(() => loading.classList.add('hidden'), 500);
      }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
